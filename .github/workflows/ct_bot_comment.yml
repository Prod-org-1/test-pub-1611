# QA-13984: posts a github-actions[bot] PR comment so the GitHub PR comment-added content trigger
# can be checked to skip bot comments. Fires only for the ct-bot-comment label (already created).
name: ct-bot-comment
on:
  pull_request:
    types: [labeled]
permissions:
  issues: write
  pull-requests: write
jobs:
  comment:
    if: github.event.label.name == 'ct-bot-comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `ct-bot-comment for ${context.payload.pull_request.title}`,
            });
